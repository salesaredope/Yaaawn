<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Dream. — diary</title>
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="manifest" href="./manifest.json">
  <style>
    :root {
      --text-primary:   #F0EDE8;
      --text-secondary: #9A9590;
      --text-tertiary:  #606060;
      --text-ghost:     #303030;
      --dream-border:   #1C1C1C;
      --transition:     600ms;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #000;
      color: var(--text-primary);
      font-family: Georgia, 'Times New Roman', serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      min-height: 100svh;
      max-width: 480px;
      margin: 0 auto;
      padding-bottom: 80px;
    }

    /* ─── Header ─────────────────────────────────────────────────────────────── */
    #header {
      padding: 40px 28px 0;
    }

    .diary-title {
      font-size: 32px;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    #dream-count {
      font-size: 12px;
      color: var(--text-tertiary);
      letter-spacing: 0.3px;
      margin-bottom: 24px;
    }

    /* ─── Search ─────────────────────────────────────────────────────────────── */
    #search-wrap {
      padding: 0 28px 20px;
      border-bottom: 1px solid var(--dream-border);
    }

    #search-input {
      width: 100%;
      background: none;
      border: 1px solid var(--dream-border);
      border-radius: 50px;
      color: var(--text-primary);
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 14px;
      padding: 10px 18px;
      outline: none;
      caret-color: var(--text-primary);
      transition: border-color var(--transition);
      letter-spacing: 0.2px;
    }

    #search-input::placeholder {
      color: var(--text-ghost);
    }

    #search-input:focus {
      border-color: var(--text-tertiary);
    }

    /* ─── Entry list ─────────────────────────────────────────────────────────── */
    #entry-list {
      padding: 0 28px;
    }

    .entry-item {
      padding: 20px 0;
      border-bottom: 1px solid var(--dream-border);
      cursor: pointer;
      transition: opacity var(--transition);
      text-decoration: none;
      display: block;
      color: inherit;
    }

    .entry-item:active { opacity: 0.6; }

    .entry-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .entry-date {
      font-size: 11px;
      color: var(--text-tertiary);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .entry-dots {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--text-ghost);
    }

    .dot.read {
      background: var(--text-tertiary);
    }

    .entry-body {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-secondary);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    /* ─── Empty state ────────────────────────────────────────────────────────── */
    #empty-state {
      padding: 60px 28px 0;
      text-align: center;
      display: none;
    }

    #empty-state p {
      font-size: 14px;
      color: var(--text-tertiary);
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .btn-empty {
      display: inline-block;
      background: var(--text-primary);
      color: #000;
      font-family: inherit;
      font-size: 15px;
      padding: 13px 32px;
      border-radius: 50px;
      text-decoration: none;
      letter-spacing: 0.3px;
      border: none;
      cursor: pointer;
    }

    /* ─── No results ─────────────────────────────────────────────────────────── */
    #no-results {
      padding: 40px 28px 0;
      font-size: 13px;
      color: var(--text-tertiary);
      display: none;
    }

    /* ─── New dream CTA ──────────────────────────────────────────────────────── */
    #footer-cta {
      padding: 28px 28px 0;
    }

    .btn-new-dream {
      display: block;
      width: 100%;
      background: none;
      border: 1px solid var(--dream-border);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 14px;
      padding: 13px 0;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 0.3px;
      text-align: center;
      text-decoration: none;
      transition: color var(--transition), border-color var(--transition);
    }

    .btn-new-dream:hover { color: var(--text-primary); border-color: var(--text-tertiary); }

    /* ─── Bottom nav ─────────────────────────────────────────────────────────── */
    #bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 64px;
      background: #0d0d0d;
      border-top: 1px solid #1a1a1a;
      display: flex;
      align-items: stretch;
      z-index: 50;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-decoration: none;
      color: var(--text-secondary);
      font-family: Georgia, serif;
      transition: color var(--transition);
    }

    .nav-item:not(:last-child) { border-right: 1px solid #1a1a1a; }
    .nav-item.active { color: var(--text-primary); }
    .nav-icon  { display: flex; align-items: center; justify-content: center; line-height: 1; }
    .nav-label { font-size: 10px; letter-spacing: 0.5px; }
  </style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1 class="diary-title">Diary.</h1>
    <p id="dream-count"></p>
  </div>

  <div id="search-wrap">
    <input
      type="search"
      id="search-input"
      placeholder="search dreams"
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
    >
  </div>

  <div id="entry-list"></div>

  <div id="no-results">nothing found.</div>

  <div id="empty-state">
    <p>no dreams recorded yet.</p>
    <a class="btn-empty" href="./dream.html">record your first dream</a>
  </div>

  <div id="footer-cta" style="display:none">
    <a class="btn-new-dream" href="./dream.html">+ new dream</a>
  </div>
</div>

<nav id="bottom-nav">
  <a class="nav-item" href="./index.html">
    <span class="nav-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 10 Q12 6 19 10"/><path d="M5 14 Q12 20 19 14"/></svg>
    </span>
    <span class="nav-label">Yawn</span>
  </a>
  <a class="nav-item" href="./rhythm.html">
    <span class="nav-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 12 C4 7 6 7 8 12 C10 17 12 17 14 12 C16 7 18 7 20 12"/></svg>
    </span>
    <span class="nav-label">Rhythm</span>
  </a>
  <a class="nav-item active" href="./dream.html">
    <span class="nav-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </span>
    <span class="nav-label">Dream</span>
  </a>
</nav>

<script src="./dream-db.js"></script>
<script>
'use strict';

const AUTHORS = ['freud', 'jung', 'fromm'];

function formatDate(isoString) {
  const d = new Date(isoString);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }).toUpperCase();
}

function buildEntryItem(dream) {
  const a = document.createElement('a');
  a.className = 'entry-item';
  a.href = `./dream-reading.html?id=${dream.id}`;

  const meta = document.createElement('div');
  meta.className = 'entry-meta';

  const date = document.createElement('span');
  date.className = 'entry-date';
  date.textContent = formatDate(dream.created_at);

  const dots = document.createElement('span');
  dots.className = 'entry-dots';
  dots.setAttribute('aria-label', 'interpretations');

  AUTHORS.forEach(author => {
    const dot = document.createElement('span');
    dot.className = 'dot' + (dream.interpretations?.[author]?.text ? ' read' : '');
    dot.title = author;
    dots.appendChild(dot);
  });

  meta.appendChild(date);
  meta.appendChild(dots);

  const body = document.createElement('p');
  body.className = 'entry-body';
  body.textContent = dream.body;

  a.appendChild(meta);
  a.appendChild(body);
  return a;
}

function renderList(dreams) {
  const list = document.getElementById('entry-list');
  const noResults = document.getElementById('no-results');
  const emptyState = document.getElementById('empty-state');
  const footerCta = document.getElementById('footer-cta');
  const searchWrap = document.getElementById('search-wrap');

  list.innerHTML = '';

  if (dreams === null) {
    // initial empty — no dreams at all
    emptyState.style.display = 'block';
    searchWrap.style.display = 'none';
    noResults.style.display = 'none';
    footerCta.style.display = 'none';
    return;
  }

  emptyState.style.display = 'none';
  searchWrap.style.display = 'block';

  if (dreams.length === 0) {
    noResults.style.display = 'block';
    footerCta.style.display = 'none';
  } else {
    noResults.style.display = 'none';
    dreams.forEach(d => list.appendChild(buildEntryItem(d)));
    footerCta.style.display = 'block';
  }
}

function updateCount(total) {
  const el = document.getElementById('dream-count');
  if (total === 0) { el.textContent = ''; return; }
  el.textContent = total === 1 ? '1 dream' : `${total} dreams`;
}

let allDreams = [];

async function init() {
  allDreams = await DreamDB.getAllDreams();

  // Sort reverse chronological
  allDreams.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

  updateCount(allDreams.length);

  if (allDreams.length === 0) {
    renderList(null);
    return;
  }

  renderList(allDreams);
}

// ─── Search ───────────────────────────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();

  if (!q) {
    renderList(allDreams);
    return;
  }

  const results = allDreams.filter(d => {
    if (d.body?.toLowerCase().includes(q)) return true;
    if (d.symbols?.some(s => s.toLowerCase().includes(q))) return true;
    if (d.characters?.some(c => c.toLowerCase().includes(q))) return true;
    if (d.settings?.some(s => s.toLowerCase().includes(q))) return true;
    return false;
  });

  renderList(results);
});

init();
</script>
</body>
</html>
